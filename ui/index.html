<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>easynow</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="app">

  <header id="topo">
    <div class="marca">
      <span class="marca-icone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8l4 4-4 4M13 16h4"/></svg>
      </span>
      <b>easynow</b>
    </div>

    <nav id="abas"></nav>

    <div class="topo-acoes">
      <div id="estado-geral" class="estado">Tudo calmo</div>
      <button id="btn-grade" class="botao icone" title="Ver todas (Ctrl+Shift+G)">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
      </button>
    </div>
  </header>

  <aside id="esquerda">
    <section class="card">
      <h2>Limites <span class="contador">atualiza a cada 2 min</span></h2>
      <div id="limites"></div>
    </section>

    <section class="card cresce">
      <h2>Sessões <span id="n-sessoes" class="contador">0</span></h2>
      <ul id="sessoes" class="lista"></ul>
    </section>
  </aside>

  <main id="centro" class="card">
    <div id="barra-agente">
      <div class="agente-nome">
        <span id="ba-ic" class="ic"></span>
        <b id="ba-titulo">—</b>
      </div>
      <div class="chips">
        <span class="chip" id="ba-pasta">—</span>
        <span class="chip" id="ba-branch" hidden></span>
      </div>
    </div>
    <div id="terminais"></div>
    <div id="vazio" hidden>
      <b>Nenhum agente aberto</b>
      <span>O que você quer abrir?</span>
      <div>
        <button class="botao grande" data-tipo="claude">Claude</button>
        <button class="botao grande" data-tipo="codex">Codex</button>
        <button class="botao grande" data-tipo="shell">Shell</button>
      </div>
    </div>
  </main>

  <aside id="direita">
    <section class="card cresce">
      <h2>Agente ativo <span id="op-n" class="contador"></span></h2>
      <span id="op-tag" class="tag">—</span>
      <b id="op-titulo">Aguardando instrução</b>
      <p id="op-desc">Nenhum agente aberto.</p>
      <div class="trilho"><i id="op-trilho"></i></div>
      <dl id="sinal" class="pares"></dl>
    </section>
  </aside>


</div>

<div id="menu-novo" class="menu" hidden></div>

<div id="modal" hidden>
  <div class="card">
    <b id="modal-titulo"></b>
    <p id="modal-texto"></p>
    <div class="modal-botoes">
      <button class="botao" id="modal-nao">Cancelar</button>
      <button class="botao perigo" id="modal-sim">Fechar</button>
    </div>
  </div>
</div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
