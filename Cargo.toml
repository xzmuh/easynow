[package]
name = "easynow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
notify = "8.2.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["custom-protocol"] }
ureq = { version = "3.4.2", features = ["json"] }
whisper-rs = "0.16.0"

[build-dependencies]
tauri-build = "2"
