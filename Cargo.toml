[package]
name = "easynow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tauri = { version = "2", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = "2"
